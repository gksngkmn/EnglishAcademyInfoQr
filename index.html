<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Vezirköprü English Academy</title>

  <meta
    name="description"
    content="Vezirköprü English Academy - Ahmet Türkoğlu, Kurs Müdürü"
  >

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        Helvetica,
        Arial,
        sans-serif;

      background:
        linear-gradient(
          135deg,
          #f4f7fc 0%,
          #e9eef8 100%
        );

      display: flex;
      align-items: center;
      justify-content: center;

      padding: 24px;
      color: #0b2c60;
    }

    .card {
      width: 100%;
      max-width: 440px;

      background: #ffffff;

      border-radius: 28px;

      padding: 30px 25px 25px;

      box-shadow:
        0 20px 50px rgba(16, 44, 90, 0.12);

      text-align: center;
    }

    /* LOGO */

    .logo-container {
      width: 100%;

      display: flex;
      justify-content: center;
      align-items: center;

      margin-bottom: 25px;
    }

    .logo {
      width: 100%;
      max-width: 340px;
      height: auto;

      object-fit: contain;
      display: block;
    }

    /* KİŞİ BİLGİLERİ */

    .person {
      background: #f7f9fd;

      border: 1px solid #e3e8f2;

      border-radius: 20px;

      padding: 20px;

      margin-bottom: 22px;
    }

    .person h1 {
      font-size: 24px;
      font-weight: 700;

      color: #0b2c60;

      margin-bottom: 6px;
    }

    .person p {
      font-size: 15px;
      color: #6b7487;

      font-weight: 500;
    }

    /* BUTONLAR */

    .buttons {
      display: flex;
      flex-direction: column;

      gap: 12px;

      margin-bottom: 22px;
    }

    .btn {
      width: 100%;

      padding: 15px 18px;

      border-radius: 15px;

      text-decoration: none;

      font-size: 16px;
      font-weight: 650;

      display: flex;
      align-items: center;
      justify-content: center;

      gap: 9px;

      transition:
        transform 0.2s ease,
        box-shadow 0.2s ease;
    }

    .btn:hover {
      transform: translateY(-2px);

      box-shadow:
        0 8px 20px rgba(0, 0, 0, 0.12);
    }

    .btn:active {
      transform: scale(0.98);
    }

    /* ARA */

    .btn-call {
      background: #0b2c60;
      color: white;
    }

    /* WHATSAPP */

    .btn-whatsapp {
      background: #25d366;
      color: white;
    }

    /* INSTAGRAM */

    .btn-instagram {
      background:
        linear-gradient(
          45deg,
          #f58529,
          #dd2a7b,
          #8134af,
          #515bd4
        );

      color: white;
    }

    /* KONUM */

    .btn-location {
      background: #c8102e;
      color: white;
    }

    /* İLETİŞİM BİLGİLERİ */

    .info {
      background: #f8faff;

      border: 1px solid #e4e9f2;

      border-radius: 20px;

      padding: 20px;

      text-align: left;
    }

    .info-title {
      font-size: 15px;
      font-weight: 700;

      color: #0b2c60;

      margin-bottom: 15px;
    }

    .info-item {
      margin-bottom: 15px;
    }

    .info-item:last-child {
      margin-bottom: 0;
    }

    .info-label {
      display: block;

      font-size: 13px;
      font-weight: 600;

      color: #8a93a5;

      margin-bottom: 4px;
    }

    .info-value {
      font-size: 15px;

      color: #344054;

      line-height: 1.6;
    }

    .phone-link {
      text-decoration: none;
      color: #344054;
    }

    /* FOOTER */

    .footer {
      margin-top: 20px;

      font-size: 12px;

      color: #9ba3b2;
    }

    /* MOBİL */

    @media (max-width: 480px) {

      body {
        padding: 15px;
      }

      .card {
        padding: 24px 18px 22px;

        border-radius: 24px;
      }

      .logo {
        max-width: 310px;
      }

      .logo-container {
        margin-bottom: 20px;
      }

      .person h1 {
        font-size: 22px;
      }

      .btn {
        padding: 14px 16px;

        font-size: 15px;
      }
    }
  </style>
</head>


<body>

  <main class="card">

    <!-- LOGO -->

    <div class="logo-container">
      <img
        src="logo.png"
        alt="Vezirköprü English Academy"
        class="logo"
      >
    </div>


    <!-- KİŞİ -->

    <section class="person">

      <h1>Ahmet Türkoğlu</h1>

      <p>Kurucu Müdür</p>

    </section>


    <!-- BUTONLAR -->

    <section class="buttons">

      <!-- TELEFON -->

      <a
        href="tel:+905438596331"
        class="btn btn-call"
      >
        📞 Ara
      </a>


      <!-- WHATSAPP -->

      <a
        href="https://wa.me/905438596331"
        target="_blank"
        rel="noopener noreferrer"
        class="btn btn-whatsapp"
      >
        💬 WhatsApp
      </a>


      <!-- INSTAGRAM -->

      <a
        href="https://www.instagram.com/english_academy_55/"
        target="_blank"
        rel="noopener noreferrer"
        class="btn btn-instagram"
      >
        📸 Instagram
      </a>


      <!-- KONUM -->

      <a
        href="https://www.google.com/maps/search/?api=1&query=Atat%C3%BCrk+Mahallesi+613.+Sokak+No+8%2F1+8%2F2+Vezirk%C3%B6pr%C3%BC+Samsun"
        target="_blank"
        rel="noopener noreferrer"
        class="btn btn-location"
      >
        📍 Yol Tarifi
      </a>

    </section>


    <!-- İLETİŞİM BİLGİLERİ -->

    <section class="info">

      <div class="info-title">
        İletişim Bilgileri
      </div>


      <div class="info-item">

        <span class="info-label">
          Telefon
        </span>

        <a
          href="tel:+905326922959"
          class="info-value phone-link"
        >
          0532 692 29 59
        </a>

      </div>


      <div class="info-item">

        <span class="info-label">
          Adres
        </span>

        <div class="info-value">
          Atatürk Mahallesi 613. Sokak<br>
          No: 8/1 - 8/2<br>
          Vezirköprü / Samsun
        </div>

      </div>

    </section>


    <!-- FOOTER -->

    <footer class="footer">
      Vezirköprü English Academy
    </footer>

  </main>

</body>
</html>
