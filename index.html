<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>Vezirköprü English Academy</title>
  <meta name="description" content="Vezirköprü English Academy - Ahmet Türkoğlu, Kurs Müdürü">
  <style>
    *{margin:0;padding:0;box-sizing:border-box}
    body{min-height:100vh;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:linear-gradient(135deg,#f4f7fc 0%,#e9eef8 100%);display:flex;align-items:center;justify-content:center;padding:24px;color:#0b2c60}
    .card{width:100%;max-width:440px;background:#fff;border-radius:28px;padding:24px 24px 26px;box-shadow:0 20px 50px rgba(16,44,90,.12);text-align:center}
    .logo-container{width:100%;display:flex;justify-content:center;align-items:center;margin-bottom:22px}
    .logo{display:block;width:100%;max-width:330px;height:auto;border:0}
    .person{background:#f7f9fd;border:1px solid #e3e8f2;border-radius:20px;padding:20px;margin-bottom:22px}
    .person h1{font-size:24px;font-weight:700;color:#0b2c60;margin-bottom:6px}
    .person p{font-size:15px;color:#6b7487;font-weight:500}
    .buttons{display:flex;flex-direction:column;gap:12px;margin-bottom:22px}
    .btn{width:100%;padding:15px 18px;border-radius:15px;text-decoration:none;font-size:16px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:9px}
    .btn-call{background:#0b2c60;color:#fff}.btn-whatsapp{background:#25d366;color:#fff}.btn-instagram{background:linear-gradient(45deg,#f58529,#dd2a7b,#8134af,#515bd4);color:#fff}.btn-location{background:#c8102e;color:#fff}
    .info{background:#f8faff;border:1px solid #e4e9f2;border-radius:20px;padding:20px;text-align:left}
    .info-title{font-size:15px;font-weight:700;color:#0b2c60;margin-bottom:15px}
    .info-item{margin-bottom:15px}.info-item:last-child{margin-bottom:0}
    .info-label{display:block;font-size:13px;font-weight:600;color:#8a93a5;margin-bottom:4px}
    .info-value{font-size:15px;color:#344054;line-height:1.6}.phone-link{text-decoration:none;color:#344054}
    .footer{margin-top:20px;font-size:12px;color:#9ba3b2}
    @media(max-width:480px){body{padding:14px}.card{padding:20px 18px 22px;border-radius:24px}.logo{max-width:320px}.person h1{font-size:22px}.btn{padding:14px 16px;font-size:15px}}
  </style>
</head>
